[package]
name = "playlist-curator"
version = "0.1.0"
description = "Reorganise your Spotify playlists by genre, origin and era"
authors = []
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.80"

# Excluded from the workspace because Tauri's webkit2gtk-4.1 requirement is not
# met on Ubuntu 20.04. Build the Tauri shell on Windows, macOS or Ubuntu 22.04+.
# The Rust core (pc-core) is a separate crate with no Tauri dependency and is
# fully testable with `cargo test`.

[lib]
name = "playlist_curator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

pc-core = { path = "../core" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
